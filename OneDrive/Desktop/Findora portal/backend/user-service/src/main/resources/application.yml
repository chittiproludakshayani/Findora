server:
  port: ${USER_SERVICE_PORT:8081}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/findora_users?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
findora:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
